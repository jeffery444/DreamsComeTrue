        :root {
            --bg-main: #000000;

            --surface-hover: #171717;
            --border-color: rgba(255, 255, 255, 0.12);
            --border-light: rgba(255, 255, 255, 0.25);
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --text-tertiary: #48484a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Inter', 'Noto Sans JP', -apple-system, sans-serif;
            min-height: 100vh;
            padding-bottom: 60px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 20px;
            padding-top: calc(16px + env(safe-area-inset-top));
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 16px;
        }

        .brand-logo {
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--text-primary);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .progress-stat {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        .progress-stat span {
            color: var(--text-primary);
            font-size: 1rem;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.65rem;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 14px;
        }

        .stat-badge {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px;
            text-align: center;
        }

        .stat-badge .rank-label {
            font-size: 0.55rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 2px;
        }

        .stat-badge .rank-val {
            font-size: 0.85rem;
            font-weight: 700;
        }

        /* Filter Navigation */
        .filter-nav {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .filter-nav::-webkit-scrollbar { display: none; }

        .filter-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .filter-btn.active {
            background: var(--text-primary);
            color: var(--bg-main);
            border-color: var(--text-primary);
        }

        /* Container & Cards */
        .container {
            padding: 16px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        .trophy-card {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.2s ease;
            position: relative;
        }

        .trophy-card.unlocked {
            background: #121212;
            border-color: var(--border-light);
        }

        .trophy-card.ultimate {
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.05);
        }

        .icon-box {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: var(--text-tertiary);
            flex-shrink: 0;
        }

        .unlocked .icon-box {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .trophy-info { flex-grow: 1; }

        .trophy-name {
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 0.3px;
            margin-bottom: 3px;
            color: var(--text-primary);
        }

        .trophy-card:not(.unlocked) .trophy-name {
            color: var(--text-secondary);
        }

        .trophy-condition {
            font-size: 0.75rem;
            color: var(--text-secondary);
            line-height: 1.3;
            margin-bottom: 6px;
        }

        .trophy-meta {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .rank-tag {
            font-size: 0.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .unlocked-tag {
            font-size: 0.65rem;
            color: var(--text-primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .unlock-btn {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* Notification */
        #notification {
            position: fixed;
            top: calc(16px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            width: 90%;
            max-width: 400px;
            background: #ffffff;
            color: #000000;
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.15);
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #notification.show { transform: translateX(-50%) translateY(0); }

        .notif-icon {
            width: 36px;
            height: 36px;
            background: #000000;
            color: #ffffff;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Modals (Auth & Unlock) */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            z-index: 500;
            align-items: center;
            justify-content: center;
            padding: 20px;

        .modal-content {
            background: #0d0d0d;
            border: 1px solid var(--border-light);
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 24px;

        .modal-title {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 16px;
            text-align: center;
            letter-spacing: 0.5px;

            border-radius: 8px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 0.9rem;
            margin-bottom: 12px;
            outline: none;

        .modal-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            background: var(--text-primary);
            color: var(--bg-main);

            font-size: 0.75rem;

            border: 1px dashed var(--border-light);
            border-radius: 10px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.02);

            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 8px;
            display: none;
            margin-bottom: 16px;
        }

        .modal-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .btn-cancel { background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); }
    </style>
</head>

    <div id="notification">

    <div class="modal" id="unlock-modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-trophy-title">実績を解除</div>
            <div class="photo-upload-zone" onclick="document.getElementById('photo-input').click()">

            <img id="photo-preview" class="photo-preview" alt="Preview">

            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeUnlockModal()">キャンセル</button>

            { id: 67, name: 'お口に合いますか？', condition: '見知らぬ国の料理を食べる', rank: 'bronze' },
            { id: 68, name: 'セルフメンテナンス', condition: 'プロのマッサージや整体を受ける', rank: 'bronze' },
            { id: 69, name: 'サプライズサンタ', condition: 'なんでもない日、身近な人に贈り物をする', rank: 'bronze' },
            { id: 70, name: '小さな親切', condition: 'お釣りを忘れている人に声をかける', rank: 'bronze' },
            { id: 71, name: '狙い撃ち', condition: 'カプセルトイにて一回で1番欲しいものを当てる', rank: 'bronze' },
            { id: 72, name: '形勢逆転', condition: '麻雀で役満を上がる', rank: 'bronze' },
            { id: 73, name: 'なんのその', condition: '1人でファミリーレストランへ入店して食事する', rank: 'bronze' },
            { id: 74, name: 'いざラスベガスへ', condition: 'ポーカーでロイヤルフラッシュを完成させる', rank: 'bronze' },
            { id: 75, name: '魂を賭けよう', condition: 'カードゲームエジプトで手札を見ずにエジプトを完成させる', rank: 'bronze' },
            { id: 76, name: '寿司屋へ行こう', condition: '釣りを6時間以上試み、一匹も釣り上げない', rank: 'bronze' },
            { id: 77, name: 'ゲーマー', condition: '1本のゲームタイトルを1000時間以上遊ぶ', rank: 'bronze' },
            { id: 78, name: '恥知らずの', condition: '旅行に置いて行かれる', rank: 'bronze' }
        ];

        // 認証状態の監視
        auth.onAuthStateChanged(user => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-modal').classList.remove('active');
                loadUserData();
            } else {
                currentUser = null;
                userState = {};
                document.getElementById('auth-modal').classList.add('active');
                renderTrophies();
            }
        });

        // ログイン・登録の切り替え
        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('auth-title').innerText = isSignUpMode ? '新規アカウント登録' : 'ログイン';
            document.getElementById('auth-submit-btn').innerText = isSignUpMode ? '登録する' : 'ログイン';
            document.getElementById('auth-switch-text').innerText = isSignUpMode ? 'すでにアカウントをお持ちの方はログイン' : 'アカウントをお持ちでない方は新規登録';
        }

        async function handleAuth() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            if (!email || !password) return alert('メールアドレスとパスワードを入力してください');

            try {
                if (isSignUpMode) {
                    await auth.createUserWithEmailAndPassword(email, password);
                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                }
            } catch (error) {
                alert('エラー: ' + error.message);
            }
        }

        async function logout() {
            await auth.signOut();
        }

        // Firestoreからユーザーデータをロード
        async function loadUserData() {
            if (!currentUser) return;
            const docRef = db.collection('users').doc(currentUser.uid).collection('trophies').doc('status');
            const doc = await docRef.get();
            if (doc.exists) {
                userState = doc.data() || {};
            } else {
                userState = {};
            }
            renderTrophies();
        }

        // Firestoreへユーザーデータをセーブ
        async function saveUserData() {
            if (!currentUser) return;
            const docRef = db.collection('users').doc(currentUser.uid).collection('trophies').doc('status');
            await docRef.set(userState);
        }

        function renderTrophies(filter = 'all') {
            const listEl = document.getElementById('trophy-list');
            listEl.innerHTML = '';

            let count = { platinum: 0, gold: 0, silver: 0, bronze: 0 };
            let totalUnlocked = 0;

            defaultTrophies.forEach(t => {
                const isUnlocked = !!userState[t.id];
                if (isUnlocked) {
                    count[t.rank]++;
                    totalUnlocked++;
                }

                if (filter !== 'all') {
                    if (filter === 'unlocked' && !isUnlocked) return;
                    if (filter !== 'unlocked' && t.rank !== filter) return;
                }

                const card = document.createElement('div');
                card.className = `trophy-card ${isUnlocked ? 'unlocked' : ''} ${t.isUltimate ? 'ultimate' : ''}`;
                
                card.innerHTML = `
                    <div class="icon-box"><i class="fa-solid fa-trophy"></i></div>
                    <div class="trophy-info">
                        <div class="trophy-name">${t.isUltimate ? '★ ' : ''}${t.name}</div>
                        <div class="trophy-condition">${t.condition}</div>
                        <div class="trophy-meta">
                            <span class="rank-tag">${t.rank}</span>
                            ${isUnlocked ? `<span class="unlocked-tag"><i class="fa-solid fa-check"></i> ${userState[t.id].date}</span>` : ''}
                        </div>
                    </div>
                    ${!isUnlocked ? `<button class="unlock-btn" onclick="openUnlockModal(${t.id})">解除</button>` : ''}
                `;
                listEl.appendChild(card);
            });

            document.getElementById('count-plat').innerText = count.platinum;
            document.getElementById('count-gold').innerText = count.gold;
            document.getElementById('count-silver').innerText = count.silver;
            document.getElementById('count-bronze').innerText = count.bronze;

            const percent = Math.round((totalUnlocked / defaultTrophies.length) * 100);
            document.getElementById('progress-percent').innerText = `${percent}%`;
        }

        function filterTrophies(filter) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            renderTrophies(filter);
        }

        function openUnlockModal(id) {
            selectedTrophyId = id;
            const trophy = defaultTrophies.find(t => t.id === id);
            document.getElementById('modal-trophy-title').innerText = `「${trophy.name}」`;
            document.getElementById('photo-preview').style.display = 'none';
            document.getElementById('photo-input').value = '';
            document.getElementById('unlock-modal').classList.add('active');
        }

        function closeUnlockModal() {
            document.getElementById('unlock-modal').classList.remove('active');
            selectedTrophyId = null;
        }

        function previewImage(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = document.getElementById('photo-preview');
                    img.src = evt.target.result;
                    img.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        async function confirmUnlock() {
            if (!selectedTrophyId) return;

            const trophy = defaultTrophies.find(t => t.id === selectedTrophyId);
            userState[selectedTrophyId] = {
                date: new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' }),
                photo: document.getElementById('photo-preview').src || null
            };

            await saveUserData();
            closeUnlockModal();
            renderTrophies();
            showNotification(trophy.name);
        }

        function showNotification(title) {
            const notif = document.getElementById('notification');
            document.getElementById('notif-title').innerText = title;
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 3500);
        }
    </script>
</body>
</html>
