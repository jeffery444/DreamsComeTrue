　<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Life Trophies</title>
    
    <!-- PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Life Trophies">
    
    <!-- FontAwesome & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Firebase SDK (Compat v10) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        /* デフォルト：ダークモード */
        :root {
            --bg-main: #000000;
            --surface-card: #0d0d0d;
            --surface-hover: #171717;
            --border-color: rgba(255, 255, 255, 0.12);
            --border-light: rgba(255, 255, 255, 0.25);
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --text-tertiary: #48484a;
            --accent-red: #ff2d55;
            --accent-gold: #ffd60a;
            --nav-bg: rgba(0, 0, 0, 0.92);
        }

        /* ライトモード用変数 */
        body.light-mode {
            --bg-main: #f2f2f7;
            --surface-card: #ffffff;
            --surface-hover: #e5e5ea;
            --border-color: rgba(0, 0, 0, 0.1);
            --border-light: rgba(0, 0, 0, 0.2);
            --text-primary: #000000;
            --text-secondary: #3a3a3c;
            --text-tertiary: #8e8e93;
            --accent-red: #ff3b30;
            --accent-gold: #d4a000;
            --nav-bg: rgba(255, 255, 255, 0.92);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Inter', 'Noto Sans JP', -apple-system, sans-serif;
            min-height: 100vh;
            padding-bottom: 80px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 20px;
            padding-top: calc(14px + env(safe-area-inset-top));
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .brand-logo {
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-primary);
            cursor: pointer;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-icon-btn {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 1.1rem;
            cursor: pointer;
            position: relative;
        }

        .notif-badge-dot {
            position: absolute;
            top: -2px;
            right: -2px;
            width: 8px;
            height: 8px;
            background: var(--accent-red);
            border-radius: 50%;
            display: none;
        }

        .progress-stat {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        .progress-stat span {
            color: var(--text-primary);
            font-size: 1rem;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 4px;
        }

        .stat-badge {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px;
            text-align: center;
        }

        .stat-badge .rank-label {
            font-size: 0.55rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 2px;
        }

        .stat-badge .rank-val { font-size: 0.85rem; font-weight: 700; color: var(--text-primary); }

        /* Bottom Navigation Bar */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: var(--nav-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 0.6rem;
            font-weight: 600;
            gap: 3px;
            cursor: pointer;
            flex: 1;
            height: 100%;
            background: transparent;
            border: none;
            transition: color 0.2s;
        }

        .nav-item.active { color: var(--text-primary); }
        .nav-item i { font-size: 1.2rem; }

        .container {
            padding: 16px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Board Category Switcher (通常実績 / カスタム実績の別項目タブ) */
        .category-tabs {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 14px;
            background: var(--surface-card);
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
        }

        .category-tab-btn {
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 0.8rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
        }

        .category-tab-btn.active {
            background: var(--text-primary);
            color: var(--bg-main);
        }

        /* Profile Banner Box */
        .profile-card-header {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .profile-avatar-large {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--surface-hover);
            border: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: var(--text-secondary);
            object-fit: cover;
            flex-shrink: 0;
        }

        .profile-info { flex-grow: 1; }
        .profile-displayname { font-size: 1rem; font-weight: 900; color: var(--text-primary); margin-bottom: 1px; }
        .profile-username { font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 6px; }
        .profile-bio { font-size: 0.75rem; color: var(--text-secondary); line-height: 1.3; margin-bottom: 8px; }

        .follow-stats-row {
            display: flex;
            gap: 12px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .follow-stats-row div { cursor: pointer; }
        .follow-stats-row span { font-weight: 700; color: var(--text-primary); }

        .btn-action-small {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-action-small.following {
            background: var(--surface-hover);
            border-color: transparent;
        }

        /* Trophy Card */
        .trophy-card {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: all 0.2s ease;
            position: relative;
        }

        .trophy-card.unlocked {
            background: var(--surface-card);
            border-color: var(--border-light);
        }

        .trophy-card.ultimate {
            border: 1px solid var(--text-primary);
            box-shadow: inset 0 0 15px rgba(128, 128, 128, 0.05);
        }

        .icon-box {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: var(--surface-hover);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: var(--text-tertiary);
            flex-shrink: 0;
            overflow: hidden;
        }

        .icon-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .unlocked .icon-box {
            color: var(--text-primary);
            background: var(--surface-hover);
            border-color: var(--border-light);
        }

        .trophy-info { flex-grow: 1; min-width: 0; }
        .trophy-name { font-size: 0.9rem; font-weight: 700; margin-bottom: 3px; color: var(--text-primary); word-break: break-word; }
        .trophy-card:not(.unlocked) .trophy-name { color: var(--text-secondary); }
        .trophy-condition { font-size: 0.75rem; color: var(--text-secondary); line-height: 1.3; margin-bottom: 6px; word-break: break-word; }

        .trophy-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .rank-tag {
            font-size: 0.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 2px 6px;
            border-radius: 4px;
            background: var(--surface-hover);
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .unlocked-tag {
            font-size: 0.65rem;
            color: var(--text-primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .unlock-btn {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .delete-btn {
            background: rgba(255, 59, 48, 0.15);
            border: 1px solid rgba(255, 59, 48, 0.3);
            color: var(--accent-red);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.72rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }

        .card-actions-group {
            display: flex;
            gap: 6px;
            align-items: center;
            flex-shrink: 0;
        }

        /* Feed Card */
        .feed-card {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .feed-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }

        .feed-user-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .feed-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--surface-hover);
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
        }

        .feed-display-name { font-size: 0.85rem; font-weight: 800; color: var(--text-primary); }
        .feed-user-name { font-size: 0.65rem; color: var(--text-secondary); }
        .feed-time { font-size: 0.65rem; color: var(--text-secondary); }

        .feed-trophy-banner {
            background: var(--surface-hover);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .feed-photo {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .feed-actions {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .feed-actions-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .feed-action-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .feed-action-btn.liked { color: var(--accent-red); }

        .feed-comments-section {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }
        .comment-item { font-size: 0.75rem; margin-bottom: 6px; color: var(--text-secondary); }
        .comment-item b { color: var(--text-primary); }

        .comment-input-box {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        /* 1列3枚のギャラリー */
        .gallery-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .gallery-item {
            aspect-ratio: 1;
            position: relative;
            overflow: hidden;
            border-radius: 6px;
            background: var(--surface-card);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item-title {
            position: absolute;
            bottom: 0;
            inset-x: 0;
            background: rgba(0,0,0,0.75);
            font-size: 0.55rem;
            padding: 3px 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }

        /* 解除済み実績リスト (マイページ用) */
        .unlocked-manage-card {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .unlocked-manage-thumb {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
            background: var(--surface-hover);
            flex-shrink: 0;
        }

        /* Notification Toast (ポップアップ通知) */
        #notification {
            position: fixed;
            top: calc(16px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%) translateY(-120px);
            width: 92%;
            max-width: 400px;
            background: var(--text-primary);
            color: var(--bg-main);
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35);
            z-index: 3000;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            pointer-events: none;
        }

        #notification.show { transform: translateX(-50%) translateY(0); }
        .notif-icon { width: 36px; height: 36px; background: var(--bg-main); color: var(--text-primary); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: var(--surface-card);
            border: 1px solid var(--border-light);
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 24px;
            color: var(--text-primary);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-title { font-size: 1rem; font-weight: 700; margin-bottom: 16px; text-align: center; letter-spacing: 0.5px; }

        .form-input {
            width: 100%;
            background: var(--surface-hover);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 0.9rem;
            margin-bottom: 12px;
            outline: none;
        }

        .form-input:focus { border-color: var(--text-primary); }

        .form-select {
            width: 100%;
            background: var(--surface-hover);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 0.9rem;
            margin-bottom: 12px;
            outline: none;
        }

        .modal-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            background: var(--text-primary);
            color: var(--bg-main);
            margin-top: 6px;
        }

        .photo-upload-zone {
            border: 2px dashed var(--border-light);
            border-radius: 10px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 16px;
            background: var(--surface-hover);
            transition: border-color 0.2s;
        }

        .photo-upload-zone.required-highlight {
            border-color: var(--accent-red);
        }

        .photo-preview { width: 100%; max-height: 220px; object-fit: cover; border-radius: 8px; display: none; margin-bottom: 16px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .btn-cancel { background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); }
    </style>
</head>
<body>

    <!-- Auth Modal -->
    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <div class="modal-title" id="auth-title">ログイン</div>
            <input type="email" id="auth-email" class="form-input" placeholder="メールアドレス">
            <input type="password" id="auth-password" class="form-input" placeholder="パスワード">
            <button class="modal-btn" id="auth-submit-btn" onclick="handleAuth()">ログイン</button>
            <div style="text-align:center; margin-top:14px; font-size:0.75rem; color:var(--text-secondary); cursor:pointer;" id="auth-switch-text" onclick="toggleAuthMode()">アカウントをお持ちでない方は新規登録</div>
        </div>
    </div>

    <!-- Initial Profile Setup Modal -->
    <div class="modal" id="username-modal">
        <div class="modal-content">
            <div class="modal-title">プロフィール設定</div>
            <input type="text" id="displayname-input" class="form-input" placeholder="表示名 (例: 翔太)">
            <input type="text" id="username-input" class="form-input" placeholder="ユーザーID (例: shota_trophy)">
            <input type="text" id="bio-input" class="form-input" placeholder="ステータスメッセージ (例: 人生の実績解除中！)">
            <button class="modal-btn" onclick="saveInitialProfile()">決定する</button>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal" id="edit-profile-modal">
        <div class="modal-content">
            <div class="modal-title">プロフィールを編集</div>
            <div class="photo-upload-zone" onclick="document.getElementById('avatar-input').click()">
                <i class="fa-solid fa-camera" style="font-size: 1.5rem; color: var(--text-secondary); margin-bottom: 8px;"></i>
                <div style="font-size: 0.75rem; color: var(--text-secondary);">アイコン画像を変更</div>
            </div>
            <img id="avatar-preview" class="photo-preview" alt="Avatar Preview">
            <input type="file" id="avatar-input" accept="image/*" style="display: none;" onchange="previewAvatar(event)">
            
            <input type="text" id="edit-displayname-input" class="form-input" placeholder="表示名">
            <input type="text" id="edit-username-input" class="form-input" placeholder="ユーザーID">
            <input type="text" id="edit-bio-input" class="form-input" placeholder="ステータスメッセージ">
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeModal('edit-profile-modal')">キャンセル</button>
                <button class="modal-btn" onclick="saveProfileChanges()">保存する</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal" id="settings-modal">
        <div class="modal-content">
            <div class="modal-title">⚙️ 設定</div>
            
            <div style="margin-bottom: 16px;">
                <div style="font-size: 0.8rem; font-weight: 700; margin-bottom: 6px; color: var(--text-secondary);">外観テーマ</div>
                <div style="display: flex; gap: 10px;">
                    <button class="modal-btn" id="theme-dark-btn" onclick="setTheme('dark')" style="background: #222; color: #fff; border: 1px solid #444; margin-top:0;">ダーク</button>
                    <button class="modal-btn" id="theme-light-btn" onclick="setTheme('light')" style="background: #f2f2f7; color: #000; border: 1px solid #ccc; margin-top:0;">ライト</button>
                </div>
            </div>

            <div style="margin-bottom: 16px;">
                <div style="font-size: 0.8rem; font-weight: 700; margin-bottom: 6px; color: var(--text-secondary);">プライバシー設定</div>
                <select id="privacy-select" class="form-select" onchange="savePrivacySetting(this.value)">
                    <option value="public">全体公開 (誰でも実績閲覧可能)</option>
                    <option value="followers">フォロワーのみ公開</option>
                </select>
            </div>

            <div style="margin-bottom: 16px;">
                <div style="font-size: 0.8rem; font-weight: 700; margin-bottom: 6px; color: var(--text-secondary);">アカウント管理</div>
                <button class="modal-btn" onclick="closeModal('settings-modal'); openEditProfileModal();" style="background: var(--surface-hover); color: var(--text-primary); border: 1px solid var(--border-color); margin-bottom: 6px;">プロフィール情報を編集</button>
                <button class="modal-btn" onclick="logout()" style="background: var(--surface-hover); color: var(--text-primary); border: 1px solid var(--border-color); margin-bottom: 6px;">ログアウト</button>
                <button class="modal-btn" onclick="deleteAccount()" style="background: rgba(255,59,48,0.15); color: var(--accent-red); border: none;">アカウントを削除する</button>
            </div>

            <button class="modal-btn btn-cancel" onclick="closeModal('settings-modal')">閉じる</button>
        </div>

        /* -------------------------------------------------------------
           画像軽量化・自動圧縮ユーティリティ (Firestore 1MB制限対策)
        ------------------------------------------------------------- */
        function compressImageFile(file, maxSize, quality) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = new Image();
                    img.onload = function() {
                        let width = img.width;
                        let height = img.height;
                        if (width > height) {
                            if (width > maxSize) {
                                height = Math.round(height * (maxSize / width));
                                width = maxSize;
                            }
                        } else {
                            if (height > maxSize) {
                                width = Math.round(width * (maxSize / height));
                                height = maxSize;
                            }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = evt.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        /* -------------------------------------------------------------
           データ永続化ヘルパー (Firestore + LocalStorage トリプル保存)
        ------------------------------------------------------------- */
        async function syncUserDataToStorage() {
            if (!currentUser) return;
            const uid = currentUser.uid;

            // 1. LocalStorageへ即時バックアップ
            try {
                localStorage.setItem(`lt_custom_${uid}`, JSON.stringify(customTrophies));
                localStorage.setItem(`lt_status_${uid}`, JSON.stringify(userState));
            } catch (e) {
                console.warn('LocalStorage保存警告:', e);
            }

            // 2. Firestoreのメインユーザードキュメントへ保存 (権限エラー回避・確実な永続化)
            try {
                await db.collection('users').doc(uid).set({
                    customTrophies: customTrophies,
                    trophyStatus: userState,
                    updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });
            } catch (e) {
                console.error('メインドキュメント保存エラー:', e);
            }

            // 3. サブコレクションへも同期保存 (従来互換)
            try {
                await db.collection('users').doc(uid).collection('trophies').doc('custom').set({ items: customTrophies });
                await db.collection('users').doc(uid).collection('trophies').doc('status').set(userState);
            } catch (e) {
                console.warn('サブコレクション保存警告:', e);
            }
        }

            const snapshot = await db.collection('users').where('username', '==', username).get();
            let taken = false;
            snapshot.forEach(doc => {
                if (doc.id !== currentUser.uid) taken = true;
            });
            return taken;

            if (!username) return alert('ユーザーIDを入力してください');
            if (!displayName) return alert('表示名を入力してください');

            if (await isUsernameTaken(username)) {
                return alert('このユーザーIDはすでに使われています。別のIDにしてください。');
            }

            await db.collection('users').doc(currentUser.uid).set({
                displayName: displayName,
                username: username,
                bio: bio,
                avatar: "",
                theme: "dark",
                privacy: "public",
                following: [],
                followers: [],
                customTrophies: [],
                trophyStatus: {},
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            myProfile.uid = currentUser.uid;
            myProfile.displayName = displayName;
            myProfile.username = username;
            myProfile.bio = bio;
            myProfile.theme = "dark";
            myProfile.privacy = "public";
            setTheme("dark");
            document.getElementById('username-modal').classList.remove('active');
            await loadUserData(null);

                await currentUser.delete();
                alert('アカウントを削除しました');
            } catch (error) {
                alert('エラー: 再ログインしてから再度お試しください (' + error.message + ')');
            }
        }

        /* -------------------------------------------------------------
           ユーザーデータの確実な復元 (ログアウト対策済み)
        ------------------------------------------------------------- */
        async function loadUserData(userDocData) {
            if (!currentUser) return;
            const uid = currentUser.uid;

            let loadedStatus = null;
            let loadedCustom = null;

            // 1. まずメインのuserDocDataから取得を試みる
            if (userDocData) {
                if (userDocData.trophyStatus && Object.keys(userDocData.trophyStatus).length > 0) {
                    loadedStatus = userDocData.trophyStatus;
                }
                if (Array.isArray(userDocData.customTrophies) && userDocData.customTrophies.length > 0) {
                    loadedCustom = userDocData.customTrophies;
                }
            }

            // 2. サブコレクションからも取得を試みる
            try {
                const statusDoc = await db.collection('users').doc(uid).collection('trophies').doc('status').get();
                if (statusDoc.exists && statusDoc.data() && Object.keys(statusDoc.data()).length > 0) {
                    loadedStatus = Object.assign({}, loadedStatus || {}, statusDoc.data());
                }
            } catch (e) {}

            try {
                const customDoc = await db.collection('users').doc(uid).collection('trophies').doc('custom').get();
                if (customDoc.exists && customDoc.data() && Array.isArray(customDoc.data().items)) {
                    if (!loadedCustom || customDoc.data().items.length > loadedCustom.length) {
                        loadedCustom = customDoc.data().items;
                    }
                }
            } catch (e) {}

            // 3. LocalStorageのバックアップからも復元・統合
            try {
                const localCustomStr = localStorage.getItem(`lt_custom_${uid}`);
                if (localCustomStr) {
                    const localCustom = JSON.parse(localCustomStr);
                    if (Array.isArray(localCustom) && (!loadedCustom || localCustom.length > loadedCustom.length)) {
                        loadedCustom = localCustom;
                    }
                }
                const localStatusStr = localStorage.getItem(`lt_status_${uid}`);
                if (localStatusStr) {
                    const localStatus = JSON.parse(localStatusStr);
                    if (localStatus && Object.keys(localStatus).length > 0) {
                        loadedStatus = Object.assign({}, localStatus, loadedStatus || {});
                    }
                }
            } catch (e) {}

            userState = loadedStatus || {};
            customTrophies = loadedCustom || [];

            // 整合性を保つために最新状態を同期保存
            syncUserDataToStorage();

            switchMainTab(activeTab);
        }

        function switchMainTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            if (document.getElementById(`nav-btn-${tab}`)) {
                document.getElementById(`nav-btn-${tab}`).classList.add('active');
            }

            const statsBox = document.getElementById('stats-grid-box');
            if (tab === 'trophies' || tab === 'other-profile') {
                statsBox.style.display = 'grid';
            } else {
                statsBox.style.display = 'none';
            }

            if (tab === 'trophies') renderTrophiesView();
            else if (tab === 'feed') renderFeedView();
            else if (tab === 'search') renderSearchView();
            else if (tab === 'profile') renderMyProfileView();
        }

        function getAllTrophies() {
            return [...defaultTrophies, ...customTrophies];
        }

        /* -------------------------------------------------------------
           実績一覧 View (通常実績 / カスタム実績の別項目切り替え対応)
        ------------------------------------------------------------- */
        function renderTrophiesView() {
            const container = document.getElementById('main-container');
            container.innerHTML = '';

            // 1. 通常実績 / カスタム実績 切り替えタブ (別項目化)
            const categorySwitcher = document.createElement('div');
            categorySwitcher.className = 'category-tabs';
            categorySwitcher.innerHTML = `
                <button class="category-tab-btn ${boardCategory === 'default' ? 'active' : ''}" onclick="boardCategory='default'; renderTrophiesView();">
                    🏆 通常実績 (${defaultTrophies.length})
                </button>
                <button class="category-tab-btn ${boardCategory === 'custom' ? 'active' : ''}" onclick="boardCategory='custom'; renderTrophiesView();">
                    ✨ カスタム実績 (${customTrophies.length})
                </button>
            `;
            container.appendChild(categorySwitcher);

            // 2. 見出し＆カスタム実績作成ボタン
            const actionRow = document.createElement('div');
            actionRow.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;';
            actionRow.innerHTML = `
                <div style="font-size:0.85rem; font-weight:800; color:var(--text-primary);">
                    ${boardCategory === 'default' ? '🏆 トロフィーボード' : '✨ マイ・カスタム実績'}
                </div>
                <button class="btn-action-small" onclick="openModal('custom-trophy-modal')">+ カスタム実績を作成</button>
            `;
            container.appendChild(actionRow);

            // 3. ランク・解除状態フィルター
            const filterRow = document.createElement('div');
            filterRow.style.cssText = 'display:flex; gap:6px; overflow-x:auto; margin-bottom:14px; padding-bottom:2px;';
            ['all', 'unlocked', 'platinum', 'gold', 'silver', 'bronze'].forEach(f => {
                const btn = document.createElement('button');
                btn.className = `btn-action-small ${trophyFilter === f ? 'following' : ''}`;
                btn.style.cssText += 'border-radius:20px; padding:6px 12px; font-size:0.7rem; flex-shrink:0;';
                btn.innerText = f.toUpperCase();
                btn.onclick = () => { trophyFilter = f; renderTrophiesView(); };
                filterRow.appendChild(btn);
            });
            container.appendChild(filterRow);

            // 全体の統計計算（ヘッダー表示用）
            let count = { platinum: 0, gold: 0, silver: 0, bronze: 0 };
            let totalUnlocked = 0;
            const allTrophiesList = getAllTrophies();

            allTrophiesList.forEach(t => {
                if (userState[t.id]) {
                    if (count[t.rank] !== undefined) count[t.rank]++;
                    totalUnlocked++;
                }
            });

            document.getElementById('count-plat').innerText = count.platinum;
            document.getElementById('count-gold').innerText = count.gold;
            document.getElementById('count-silver').innerText = count.silver;
            document.getElementById('count-bronze').innerText = count.bronze;

            const percent = allTrophiesList.length > 0 ? Math.round((totalUnlocked / allTrophiesList.length) * 100) : 0;
            document.getElementById('progress-percent').innerText = `${percent}%`;

            // 4. 表示対象リストの描画
            const targetList = boardCategory === 'default' ? defaultTrophies : customTrophies;
            const trophyListEl = document.createElement('div');

            if (boardCategory === 'custom' && customTrophies.length === 0) {
                trophyListEl.innerHTML = `
                    <div style="text-align:center; color:var(--text-secondary); font-size:0.8rem; padding:36px 20px; background:var(--surface-card); border-radius:12px; border:1px dashed var(--border-color);">
                        まだカスタム実績がありません。<br>右上の「+ カスタム実績を作成」から自分だけの目標を追加しましょう！
                    </div>
                `;
                container.appendChild(trophyListEl);
                return;
            }

            let visibleCount = 0;
            targetList.forEach(t => {
                const isUnlocked = !!userState[t.id];

                if (trophyFilter !== 'all') {
                    if (trophyFilter === 'unlocked' && !isUnlocked) return;
                    if (trophyFilter !== 'unlocked' && t.rank !== trophyFilter) return;
                }

                visibleCount++;
                const card = document.createElement('div');
                card.className = `trophy-card ${isUnlocked ? 'unlocked' : ''} ${t.isUltimate ? 'ultimate' : ''}`;
                
                const iconContent = (isUnlocked && userState[t.id].photo)
                    ? `<img src="${userState[t.id].photo}" alt="Trophy Photo">`
                    : `<i class="fa-solid fa-trophy"></i>`;

                const infoBox = document.createElement('div');
                infoBox.className = 'trophy-info';
                infoBox.innerHTML = `
                    <div class="trophy-name">${t.isUltimate ? '★ ' : ''}${t.name}</div>
                    <div class="trophy-condition">${t.condition}</div>
                    <div class="trophy-meta">
                        <span class="rank-tag">${t.rank}</span>
                        ${isUnlocked ? `<span class="unlocked-tag"><i class="fa-solid fa-check"></i> ${userState[t.id].date} 解除済</span>` : ''}
                    </div>
                `;

                const iconBox = document.createElement('div');
                iconBox.className = 'icon-box';
                iconBox.innerHTML = iconContent;

                const actionsGroup = document.createElement('div');
                actionsGroup.className = 'card-actions-group';

                // 未解除なら「解除」ボタンを表示
                if (!isUnlocked) {
                    const unlockBtn = document.createElement('button');
                    unlockBtn.className = 'unlock-btn';
                    unlockBtn.innerText = '解除';
                    unlockBtn.onclick = () => openUnlockModal(t.id);
                    actionsGroup.appendChild(unlockBtn);
                }

                // カスタム実績なら「削除」ボタンを確実に機能するイベントとして付与
                if (t.isCustom || boardCategory === 'custom') {
                    const delBtn = document.createElement('button');
                    delBtn.className = 'delete-btn';
                    delBtn.innerText = '削除';
                    delBtn.onclick = () => deleteCustomTrophy(t.id);
                    actionsGroup.appendChild(delBtn);
                }

                card.appendChild(iconBox);
                card.appendChild(infoBox);
                card.appendChild(actionsGroup);
                trophyListEl.appendChild(card);
            });

            if (visibleCount === 0) {
                trophyListEl.innerHTML = '<div style="text-align:center; color:var(--text-secondary); font-size:0.8rem; padding:30px;">条件に一致する実績がありません</div>';
            }

            container.appendChild(trophyListEl);
        }

        /* -------------------------------------------------------------
           カスタム実績の追加・削除機能
        ------------------------------------------------------------- */
        async function addCustomTrophy() {
            const titleInput = document.getElementById('custom-title');
            const conditionInput = document.getElementById('custom-condition');
            const rankSelect = document.getElementById('custom-rank');
            
            const title = titleInput.value.trim();
            const condition = conditionInput.value.trim();
            const rank = rankSelect.value;
            
            if (!title || !condition) {
                alert('実績タイトルと達成条件の両方を入力してください');
                return;
            }

            const newTrophy = {
                id: 'custom_' + Date.now(),
                name: title,
                condition: condition,
                rank: rank,
                isCustom: true
            };

            customTrophies.push(newTrophy);

            // 入力欄をクリアして即座に追加画面を閉じる
            titleInput.value = '';
            conditionInput.value = '';
            closeModal('custom-trophy-modal');

            // カスタム実績項目（タブ）に切り替えて実績画面を即座に再描画
            boardCategory = 'custom';
            trophyFilter = 'all';
            switchMainTab('trophies');

            // ポップアップを表示
            showNotification(`「${title}」を追加しました！`, 'CUSTOM TROPHY ADDED');

            // データを3重永続化
            await syncUserDataToStorage();
        }

        async function deleteCustomTrophy(id) {
            const target = customTrophies.find(t => String(t.id) === String(id));
            const targetName = target ? target.name : 'カスタム実績';

            if (!confirm(`カスタム実績「${targetName}」を削除しますか？`)) return;

            customTrophies = customTrophies.filter(t => String(t.id) !== String(id));
            if (userState[id]) {
                delete userState[id];
            }

            // 即座に画面を再描画してポップアップを表示
            renderTrophiesView();
            showNotification(`「${targetName}」を削除しました`, 'CUSTOM TROPHY DELETED');

            // データを3重永続化
            await syncUserDataToStorage();
        }

        /* -------------------------------------------------------------
           実績解除機能（写真必須・自動圧縮・ポップアップ・確実な再描画）
        ------------------------------------------------------------- */
        function openUnlockModal(id) {
            selectedTrophyId = id;
            tempUnlockPhotoBase64 = "";
            const trophy = getAllTrophies().find(t => String(t.id) === String(id));
            document.getElementById('modal-trophy-title').innerText = `🏆 「${trophy ? trophy.name : '実績'}」を解除`;
            
            const previewEl = document.getElementById('photo-preview');
            previewEl.style.display = 'none';
            previewEl.removeAttribute('src');
            
            document.getElementById('photo-input').value = '';
            document.getElementById('unlock-photo-zone').classList.remove('required-highlight');
            document.getElementById('photo-upload-label').innerText = '📸 証拠写真を撮影・選択 (必須)';
            openModal('unlock-modal');
        }

        async function previewImage(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('photo-upload-label').innerText = '写真を処理中...';
            try {
                // Firestoreの1MB制限を超えないよう長辺800px・JPEG品質0.7に自動圧縮
                tempUnlockPhotoBase64 = await compressImageFile(file, 800, 0.7);
                const img = document.getElementById('photo-preview');
                img.src = tempUnlockPhotoBase64;
                img.style.display = 'block';
                document.getElementById('unlock-photo-zone').classList.remove('required-highlight');
                document.getElementById('photo-upload-label').innerText = '✅ 写真を選択済み (タップで変更)';
            } catch (err) {
                alert('写真の読み込みに失敗しました。別の画像をお試しください。');
                tempUnlockPhotoBase64 = "";
            }
        }

        async function confirmUnlock() {
            if (!selectedTrophyId) return;

            // 写真添付の強制チェック
            if (!tempUnlockPhotoBase64) {
                document.getElementById('unlock-photo-zone').classList.add('required-highlight');
                alert('実績を解除するには証拠写真の添付が必須です！上のカメラ枠をタップして写真を選択してください。');
                return;
            }

            const trophy = getAllTrophies().find(t => String(t.id) === String(selectedTrophyId));
            const trophyName = trophy ? trophy.name : '実績';
            const dateStr = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' });
            const unlockedId = selectedTrophyId;
            const photoToSave = tempUnlockPhotoBase64;

            // 1. ローカルの解除状態を即座に更新
            userState[unlockedId] = {
                date: dateStr,
                photo: photoToSave
            };

            // 2. 解除モーダルを即座に閉じる
            closeModal('unlock-modal');

            // 3. ボードを確実に再描画し、「実績を解除しました！」ポップアップを表示
            switchMainTab('trophies');
            showNotification(`実績を解除しました！「${trophyName}」`, 'TROPHY UNLOCKED!');

            // 4. バックグラウンドで永続化＆タイムライン投稿
            await syncUserDataToStorage();

            try {
                await db.collection('posts').add({
                    uid: currentUser.uid,
                    displayName: myProfile.displayName || myProfile.username,
                    username: myProfile.username,
                    userAvatar: myProfile.avatar,
                    trophyId: String(unlockedId),
                    trophyName: trophyName,
                    photo: photoToSave,
                    date: dateStr,
                    likes: [],
                    comments: [],
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                });
            } catch (e) {
                console.error('タイムライン投稿エラー:', e);
            }
        }

        /* -------------------------------------------------------------
           実績を解除前の状態（未解除）に戻す処理
        ------------------------------------------------------------- */
        async function revertUnlock(id) {
            const trophy = getAllTrophies().find(t => String(t.id) === String(id));
            const trophyName = trophy ? trophy.name : 'この実績';

            if (!confirm(`「${trophyName}」を解除前の状態（未解除）に戻しますか？`)) return;

            if (userState[id]) {
                delete userState[id];
            }

            // マイページを即座に再描画してポップアップを表示
            renderMyProfileView();
            showNotification(`「${trophyName}」を未解除に戻しました`, 'TROPHY RESET');

            // Firestoreの上書き保存（削除されたキーを確実に消去するため一旦空にしてセット）
            if (currentUser) {
                const uid = currentUser.uid;
                localStorage.setItem(`lt_status_${uid}`, JSON.stringify(userState));
                try {
                    await db.collection('users').doc(uid).update({ trophyStatus: userState });
                    await db.collection('users').doc(uid).collection('trophies').doc('status').set(userState);
                } catch (e) {
                    console.error('未解除への変更保存エラー:', e);
                }
            }
        }

        /* -------------------------------------------------------------
           通知機能 (Notifications)
        ------------------------------------------------------------- */

            if (targetUid === currentUser.uid) return;
            await db.collection('users').doc(targetUid).collection('notifications').add({
                type: type,
                senderUid: currentUser.uid,
                senderName: myProfile.displayName || myProfile.username,
                message: message,
                read: false,
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });
        }

        async function checkUnreadNotifications() {
            if (!currentUser) return;
            try {
                const snapshot = await db.collection('users').doc(currentUser.uid).collection('notifications').where('read', '==', false).get();
                const dot = document.getElementById('notif-badge-dot');
                dot.style.display = !snapshot.empty ? 'block' : 'none';
            } catch (e) {}
        }

        async function openNotificationsModal() {
            const container = document.getElementById('notifications-container');
            container.innerHTML = '<div style="text-align:center; color:var(--text-secondary); font-size:0.8rem; padding:20px;">読み込み中...</div>';
            openModal('notifications-modal');

            try {
                const snapshot = await db.collection('users').doc(currentUser.uid).collection('notifications').orderBy('createdAt', 'desc').limit(20).get();
                container.innerHTML = '';

                if (snapshot.empty) {
                    container.innerHTML = '<div style="text-align:center; color:var(--text-secondary); font-size:0.8rem; padding:20px;">通知はありません</div>';
                    return;
                }

                const batch = db.batch();
                snapshot.forEach(doc => {
                    batch.update(doc.ref, { read: true });
                    const data = doc.data();
                    const card = document.createElement('div');
                    card.className = 'feed-card';
                    card.style.cssText = 'padding:10px 14px; margin-bottom:8px; font-size:0.75rem;';
                    card.innerHTML = `<b>${data.senderName}</b> ${data.message}`;
                    container.appendChild(card);
                });
                await batch.commit();
                document.getElementById('notif-badge-dot').style.display = 'none';
            } catch (e) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-secondary); font-size:0.8rem; padding:20px;">通知はありません</div>';
            }
        }

        /* -------------------------------------------------------------
           フォロー・フォロワー一覧モーダル表示機能
        ------------------------------------------------------------- */
        async function openFollowListModal(type) {
            const titleEl = document.getElementById('follow-list-title');
            const listContainer = document.getElementById('follow-list-container');
            titleEl.innerText = type === 'following' ? 'フォロー中リスト' : 'フォロワーリスト';
            listContainer.innerHTML = '<div style="text-align:center; color:var(--text-secondary); font-size:0.8rem; padding:20px;">読み込み中...</div>';
            openModal('follow-list-modal');

            const targetIds = type === 'following' ? myProfile.following : myProfile.followers;
            if (!targetIds || targetIds.length === 0) {
                listContainer.innerHTML = '<div style="text-align:center; color:var(--text-secondary); font-size:0.8rem; padding:20px;">ユーザーはいません</div>';
                return;
            }

            try {
                listContainer.innerHTML = '';
                for (let uid of targetIds) {
                    const userDoc = await db.collection('users').doc(uid).get();
                    if (userDoc.exists) {
                        const data = userDoc.data();
                        const avatarHTML = data.avatar 
                            ? `<img src="${data.avatar}" class="feed-avatar">` 
                            : `<div class="feed-avatar"><i class="fa-solid fa-user"></i></div>`;

                        const card = document.createElement('div');
                        card.className = 'feed-card';
                        card.style.cssText = 'display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; padding:10px 14px; cursor:pointer;';
                        card.innerHTML = `
                            <div style="display:flex; align-items:center; gap:10px;">
                                ${avatarHTML}
                                <div>
                                    <div style="font-size:0.85rem; font-weight:700;">${data.displayName || data.username}</div>
                                    <div style="font-size:0.65rem; color:var(--text-secondary);">@${data.username}</div>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-right" style="color:var(--text-secondary); font-size:0.8rem;"></i>
                        `;
                        card.onclick = () => {
                            closeModal('follow-list-modal');
                            viewUserProfile(uid, data);
                        };
                        listContainer.appendChild(card);
                    }
                }
            } catch (e) {
                listContainer.innerHTML = '<div style="text-align:center; color:var(--text-secondary); font-size:0.8rem; padding:20px;">読み込みに失敗しました</div>';
            }
        }

        /* -------------------------------------------------------------
           タイムライン (Feed) View
        ------------------------------------------------------------- */
        async function renderFeedView() {
            const container = document.getElementById('main-container');
            container.innerHTML = '<div style="text-align:center; color:var(--text-secondary); font-size:0.8rem; padding:20px;">タイムライン読み込み中...</div>';

            try {
                const snapshot = await db.collection('posts').orderBy('createdAt', 'desc').limit(20).get();
                container.innerHTML = '<div style="font-size:0.9rem; font-weight:800; margin-bottom:14px; text-align:center;">📡 タイムライン</div>';

                if (snapshot.empty) {
                    container.innerHTML += '<div style="text-align:center; color:var(--text-secondary); font-size:0.8rem; padding:30px;">まだ投稿がありません。実績を解除してタイムラインに流そう！</div>';
                    return;
                }

                snapshot.forEach(doc => {
                    const post = doc.data();
                    const postId = doc.id;
                    const isLiked = (post.likes || []).includes(currentUser.uid);

                    const avatarHTML = post.userAvatar 
                        ? `<img src="${post.userAvatar}" class="feed-avatar">` 
                        : `<div class="feed-avatar"><i class="fa-solid fa-user"></i></div>`;

                    const card = document.createElement('div');
                    card.className = 'feed-card';
                    card.innerHTML = `
                        <div class="feed-header">
                            <div class="feed-user-info">
                                ${avatarHTML}
                                <div>
                                    <div class="feed-display-name">${post.displayName || post.username}</div>
                                    <div class="feed-user-name">@${post.username}</div>
                                </div>
                            </div>
                            <div class="feed-time">${post.date || ''}</div>
                        </div>

                        <div class="feed-trophy-banner">
                            <div style="font-size:0.65rem; color:var(--text-secondary); font-weight:800; letter-spacing:1px; margin-bottom:2px;">TROPHY UNLOCKED</div>
                            <div style="font-size:0.95rem; font-weight:800; color:var(--text-primary);">🏆 ${post.trophyName}</div>
                        </div>

                        ${post.photo ? `<img src="${post.photo}" class="feed-photo">` : ''}

                        <div class="feed-actions">
                            <div class="feed-actions-left">
                                <div class="feed-action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${postId}', ${isLiked}, '${post.uid}')">
                                    <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                                    <span>${(post.likes || []).length}</span>
                                </div>
                                <div class="feed-action-btn">
                                    <i class="fa-regular fa-comment"></i>
                                    <span>${(post.comments || []).length}</span>
                                </div>
                            </div>
                            <div class="feed-action-btn" onclick="sharePost('${post.trophyName}', '${post.displayName || post.username}')">
                                <i class="fa-solid fa-share-nodes"></i>
                            </div>
                        </div>

                        <div class="feed-comments-section">
                            <div id="comments-list-${postId}">
                                ${(post.comments || []).map(c => `<div class="comment-item"><b>${c.displayName || c.username}:</b> ${c.text}</div>`).join('')}
                            </div>
                            <div class="comment-input-box">
                                <input type="text" id="comment-input-${postId}" class="form-input" placeholder="お祝いコメントを入力..." style="margin-bottom:0; font-size:0.75rem; padding:8px 12px;">
                                <button class="btn-action-small" onclick="addComment('${postId}', '${post.uid}')">送信</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-secondary); font-size:0.8rem;">フィードの読み込みに失敗しました</div>';
            }
        }

        async function toggleLike(postId, currentLiked, postOwnerUid) {
            const postRef = db.collection('posts').doc(postId);
            if (currentLiked) {
                await postRef.update({ likes: firebase.firestore.FieldValue.arrayRemove(currentUser.uid) });
            } else {
                await postRef.update({ likes: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
                sendNotification(postOwnerUid, 'like', 'があなたの投稿に「いいね！」しました。');
            }
            renderFeedView();
        }

        async function addComment(postId, postOwnerUid) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            const postRef = db.collection('posts').doc(postId);
            await postRef.update({
                comments: firebase.firestore.FieldValue.arrayUnion({
                    uid: currentUser.uid,
                    displayName: myProfile.displayName || myProfile.username,
                    username: myProfile.username,
                    text: text,
                    createdAt: new Date().toISOString()
                })
            });

            sendNotification(postOwnerUid, 'comment', `があなたの投稿にコメントしました: "${text}"`);
            input.value = '';
            renderFeedView();
        }

        /* -------------------------------------------------------------
           ユーザー検索 View
        ------------------------------------------------------------- */
        function renderSearchView() {
            const container = document.getElementById('main-container');
            container.innerHTML = `
                <div style="font-size:0.9rem; font-weight:800; margin-bottom:14px; text-align:center;">🔍 ユーザー検索</div>
                <div style="display:flex; gap:10px; margin-bottom:20px;">
                    <input type="text" id="search-query" class="form-input" placeholder="ユーザーIDまたは名前で検索..." style="margin-bottom:0;">
                    <button class="modal-btn" style="width: 100px; margin-top:0;" onclick="searchUsers()">検索</button>
                </div>
                <div id="search-results"></div>
            `;
        }

        async function searchUsers() {
            const q = document.getElementById('search-query').value.trim().toLowerCase();
            const resultsEl = document.getElementById('search-results');
            resultsEl.innerHTML = '<div style="text-align:center; color:var(--text-secondary); font-size:0.8rem;">検索中...</div>';

            try {
                const snapshot = await db.collection('users').get();
                resultsEl.innerHTML = '';
                let found = false;

                snapshot.forEach(doc => {
                    const data = doc.data();
                    const uName = (data.username || '').toLowerCase();
                    const dName = (data.displayName || '').toLowerCase();
                    if (uName && (uName.includes(q) || dName.includes(q)) && doc.id !== currentUser.uid) {
                        found = true;
                        const avatarHTML = data.avatar 
                            ? `<img src="${data.avatar}" class="feed-avatar">` 
                            : `<div class="feed-avatar"><i class="fa-solid fa-user"></i></div>`;

                        const card = document.createElement('div');
                        card.className = 'feed-card';
                        card.style.cssText = 'display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding:12px 16px; cursor:pointer;';
                        card.innerHTML = `
                            <div style="display:flex; align-items:center; gap:12px;">
                                ${avatarHTML}
                                <div>
                                    <div style="font-size:0.9rem; font-weight:700;">${data.displayName || data.username}</div>
                                    <div style="font-size:0.7rem; color:var(--text-secondary);">@${data.username} ・ ${data.bio || 'ステータスなし'}</div>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-right" style="color:var(--text-secondary);"></i>
                        `;
                        card.onclick = () => viewUserProfile(doc.id, data);
                        resultsEl.appendChild(card);
                    }
                });

                if (!found) {
                    resultsEl.innerHTML = '<div style="text-align:center; color:var(--text-secondary); font-size:0.8rem;">ユーザーが見つかりませんでした</div>';
                }
            } catch (e) {
                resultsEl.innerHTML = '<div style="text-align:center; color:var(--text-secondary); font-size:0.8rem;">検索エラーが発生しました</div>';
            }
        }

        async function viewUserProfile(uid, profileData) {
            if (profileData.privacy === 'followers' && !profileData.followers?.includes(currentUser.uid)) {
                alert('このユーザーはフォロワーのみに実績を公開しています。');
                return;
            }

            let targetState = profileData.trophyStatus || {};
            try {
                const doc = await db.collection('users').doc(uid).collection('trophies').doc('status').get();
                if (doc.exists) targetState = Object.assign({}, targetState, doc.data());
            } catch (e) {}

            profileData.uid = uid;
            
            const statsBox = document.getElementById('stats-grid-box');
            statsBox.style.display = 'grid';
            
            const container = document.getElementById('main-container');
            container.innerHTML = '';

            const headerBox = document.createElement('div');
            headerBox.className = 'profile-card-header';
            
            const avatarHTML = profileData.avatar 
                ? `<img src="${profileData.avatar}" class="profile-avatar-large">` 
                : `<div class="profile-avatar-large"><i class="fa-solid fa-user"></i></div>`;

            const isFollowing = myProfile.following.includes(uid);

            headerBox.innerHTML = `
                ${avatarHTML}
                <div class="profile-info">
                    <div class="profile-displayname">${profileData.displayName || profileData.username}</div>
                    <div class="profile-username">@${profileData.username}</div>
                    <div class="profile-bio">${profileData.bio || 'ステータス未設定'}</div>
                    <div class="follow-stats-row">
                        <div>フォロー <span>${(profileData.following || []).length}</span></div>
                        <div>フォロワー <span>${(profileData.followers || []).length}</span></div>
                    </div>
                    <button class="btn-action-small ${isFollowing ? 'following' : ''}" onclick="toggleFollow('${uid}')">${isFollowing ? 'フォロー中' : 'フォローする'}</button>
                </div>
            `;
            container.appendChild(headerBox);

            const trophyListEl = document.createElement('div');
            let count = { platinum: 0, gold: 0, silver: 0, bronze: 0 };
            let totalUnlocked = 0;

            defaultTrophies.forEach(t => {
                const isUnlocked = !!targetState[t.id];
                if (isUnlocked) {
                    count[t.rank]++;
                    totalUnlocked++;
                }

                const card = document.createElement('div');
                card.className = `trophy-card ${isUnlocked ? 'unlocked' : ''} ${t.isUltimate ? 'ultimate' : ''}`;
                card.innerHTML = `
                    <div class="icon-box"><i class="fa-solid fa-trophy"></i></div>
                    <div class="trophy-info">
                        <div class="trophy-name">${t.isUltimate ? '★ ' : ''}${t.name}</div>
                        <div class="trophy-condition">${t.condition}</div>
                        <div class="trophy-meta">
                            <span class="rank-tag">${t.rank}</span>
                            ${isUnlocked ? `<span class="unlocked-tag"><i class="fa-solid fa-check"></i> ${targetState[t.id].date}</span>` : ''}
                        </div>
                    </div>
                `;
                trophyListEl.appendChild(card);
            });

            container.appendChild(trophyListEl);

            document.getElementById('count-plat').innerText = count.platinum;
            document.getElementById('count-gold').innerText = count.gold;
            document.getElementById('count-silver').innerText = count.silver;
            document.getElementById('count-bronze').innerText = count.bronze;

            const percent = Math.round((totalUnlocked / defaultTrophies.length) * 100);
            document.getElementById('progress-percent').innerText = `${percent}%`;
        }

        async function toggleFollow(targetUid) {
            const isFollowing = myProfile.following.includes(targetUid);
            const myRef = db.collection('users').doc(currentUser.uid);
            const targetRef = db.collection('users').doc(targetUid);

            if (isFollowing) {
                await myRef.update({ following: firebase.firestore.FieldValue.arrayRemove(targetUid) });
                await targetRef.update({ followers: firebase.firestore.FieldValue.arrayRemove(currentUser.uid) });
                myProfile.following = myProfile.following.filter(id => id !== targetUid);
            } else {
                await myRef.update({ following: firebase.firestore.FieldValue.arrayUnion(targetUid) });
                await targetRef.update({ followers: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
                myProfile.following.push(targetUid);
                sendNotification(targetUid, 'follow', 'があなたをフォローしました。');
            }

            showNotification(isFollowing ? 'フォロー解除しました' : 'フォローしました', 'FOLLOW');
            renderSearchView();
        }

        function openEditProfileModal() {
            document.getElementById('edit-displayname-input').value = myProfile.displayName || myProfile.username;
            document.getElementById('edit-username-input').value = myProfile.username;
            document.getElementById('edit-bio-input').value = myProfile.bio;
            const img = document.getElementById('avatar-preview');
            if (myProfile.avatar) {
                img.src = myProfile.avatar;
                img.style.display = 'block';
            } else {
                img.style.display = 'none';
            }
            tempAvatarBase64 = myProfile.avatar;
            openModal('edit-profile-modal');
        }

        async function previewAvatar(e) {
            const file = e.target.files[0];
            if (file) {
                try {
                    tempAvatarBase64 = await compressImageFile(file, 300, 0.7);
                    const img = document.getElementById('avatar-preview');
                    img.src = tempAvatarBase64;
                    img.style.display = 'block';
                } catch (err) {
                    alert('アイコン画像の処理に失敗しました');
                }
            }
        }

        async function saveProfileChanges() {
            const newDisplayName = document.getElementById('edit-displayname-input').value.trim();
            const newUsername = document.getElementById('edit-username-input').value.trim();
            const newBio = document.getElementById('edit-bio-input').value.trim() || "人生の実績解除中！";
            if (!newDisplayName) return alert('表示名を入力してください');
            if (!newUsername) return alert('ユーザーIDを入力してください');

            if (newUsername !== myProfile.username && await isUsernameTaken(newUsername)) {
                return alert('このユーザーIDはすでに使われています。別のIDにしてください。');
            }

            myProfile.displayName = newDisplayName;
            myProfile.username = newUsername;
            myProfile.bio = newBio;
            myProfile.avatar = tempAvatarBase64;

            closeModal('edit-profile-modal');
            switchMainTab('profile');
            showNotification('プロフィールを更新しました', 'PROFILE UPDATED');

            await db.collection('users').doc(currentUser.uid).set({
                displayName: newDisplayName,
                username: newUsername,
                bio: newBio,
                avatar: tempAvatarBase64,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function showNotification(title, subtitle = 'Trophy Unlocked') {
            const notif = document.getElementById('notification');
            document.getElementById('notif-subtitle').innerText = subtitle;
            document.getElementById('notif-title').innerText = title;
            notif.classList.add('show');
            if (notifTimer) clearTimeout(notifTimer);
            notifTimer = setTimeout(() => notif.classList.remove('show'), 3500);
        }
    </script>
</body>
</html>
