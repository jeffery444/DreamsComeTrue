<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Life Trophies</title>
    
    <!-- PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Life Trophies">
    
    <!-- FontAwesome & Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800;900&family=Noto+Sans+JP:wght@300;400;500;700&display=swap" rel="stylesheet">

    <!-- Firebase SDK (Compat v10) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --bg-main: #000000;
            --surface-card: #0d0d0d;
            --surface-hover: #171717;
            --border-color: rgba(255, 255, 255, 0.12);
            --border-light: rgba(255, 255, 255, 0.25);
            --text-primary: #ffffff;
            --text-secondary: #8e8e93;
            --text-tertiary: #48484a;
            --accent-red: #ff2d55;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: 'Inter', 'Noto Sans JP', -apple-system, sans-serif;
            min-height: 100vh;
            padding-bottom: 80px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        /* Header */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            padding: 14px 20px;
            padding-top: calc(14px + env(safe-area-inset-top));
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .brand-logo {
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-primary);
            cursor: pointer;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .progress-stat {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-secondary);
            letter-spacing: 1px;
        }

        .progress-stat span {
            color: var(--text-primary);
            font-size: 1rem;
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            font-size: 0.65rem;
            padding: 4px 8px;
            border-radius: 6px;
            cursor: pointer;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 10px;
        }

        .stat-badge {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 6px;
            text-align: center;
        }

        .stat-badge .rank-label {
            font-size: 0.55rem;
            font-weight: 800;
            letter-spacing: 1px;
            color: var(--text-secondary);
            display: block;
            margin-bottom: 2px;
        }

        .stat-badge .rank-val { font-size: 0.85rem; font-weight: 700; }

        /* Bottom Navigation Bar (4タブ) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 60px;
            background: rgba(0, 0, 0, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
            padding-bottom: env(safe-area-inset-bottom);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            font-size: 0.6rem;
            font-weight: 600;
            gap: 3px;
            cursor: pointer;
            flex: 1;
            height: 100%;
            background: transparent;
            border: none;
            transition: color 0.2s;
        }

        .nav-item.active { color: var(--text-primary); }
        .nav-item i { font-size: 1.2rem; }

        .container {
            padding: 16px 20px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* Profile Banner Box */
        .profile-card-header {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .profile-avatar-large {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid var(--border-light);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            color: var(--text-secondary);
            object-fit: cover;
            flex-shrink: 0;
        }

        .profile-info { flex-grow: 1; }
        .profile-username { font-size: 0.95rem; font-weight: 800; color: var(--text-primary); margin-bottom: 2px; }
        .profile-bio { font-size: 0.75rem; color: var(--text-secondary); line-height: 1.3; margin-bottom: 8px; }

        .follow-stats-row {
            display: flex;
            gap: 12px;
            font-size: 0.7rem;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .follow-stats-row span { font-weight: 700; color: var(--text-primary); }

        .btn-action-small {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.7rem;
            font-weight: 700;
            cursor: pointer;
        }

        .btn-action-small.following {
            background: rgba(255, 255, 255, 0.15);
            border-color: transparent;
        }

        /* Trophy Card */
        .trophy-card {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 16px;
            transition: all 0.2s ease;
            position: relative;
        }

        .trophy-card.unlocked {
            background: #121212;
            border-color: var(--border-light);
        }

        .trophy-card.ultimate {
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: inset 0 0 15px rgba(255, 255, 255, 0.05);
        }

        .icon-box {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            color: var(--text-tertiary);
            flex-shrink: 0;
        }

        .unlocked .icon-box {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.3);
        }

        .trophy-info { flex-grow: 1; }
        .trophy-name { font-size: 0.9rem; font-weight: 700; margin-bottom: 3px; color: var(--text-primary); }
        .trophy-card:not(.unlocked) .trophy-name { color: var(--text-secondary); }
        .trophy-condition { font-size: 0.75rem; color: var(--text-secondary); line-height: 1.3; margin-bottom: 6px; }

        .trophy-meta { display: flex; align-items: center; gap: 8px; }
        .rank-tag {
            font-size: 0.6rem;
            font-weight: 800;
            letter-spacing: 1px;
            padding: 2px 6px;
            border-radius: 4px;
            background: rgba(255, 255, 255, 0.06);
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .unlocked-tag {
            font-size: 0.65rem;
            color: var(--text-primary);
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .unlock-btn {
            background: transparent;
            border: 1px solid var(--border-light);
            color: var(--text-primary);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* Feed Card */
        .feed-card {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 16px;
            margin-bottom: 16px;
        }

        .feed-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        .feed-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            object-fit: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
        }

        .feed-user-name { font-size: 0.85rem; font-weight: 700; }
        .feed-time { font-size: 0.65rem; color: var(--text-secondary); }

        .feed-trophy-banner {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
        }

        .feed-photo {
            width: 100%;
            max-height: 250px;
            object-fit: cover;
            border-radius: 10px;
            margin-bottom: 12px;
        }

        .feed-actions {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .feed-action-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .feed-action-btn.liked { color: var(--accent-red); }

        .feed-comments-section {
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid var(--border-color);
        }
        .comment-item { font-size: 0.75rem; margin-bottom: 6px; color: var(--text-secondary); }
        .comment-item b { color: var(--text-primary); }

        .comment-input-box {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        /* 1列3枚のギャラリー（Instagram風） */
        .gallery-grid-3 {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
        }

        .gallery-item {
            aspect-ratio: 1;
            position: relative;
            overflow: hidden;
            border-radius: 6px;
            background: var(--surface-card);
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .gallery-item-title {
            position: absolute;
            bottom: 0;
            inset-x: 0;
            background: rgba(0,0,0,0.75);
            font-size: 0.55rem;
            padding: 3px 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: #fff;
        }

        /* Notification */
        #notification {
            position: fixed;
            top: calc(16px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            width: 90%;
            max-width: 400px;
            background: #ffffff;
            color: #000000;
            border-radius: 12px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            box-shadow: 0 10px 30px rgba(255, 255, 255, 0.15);
            z-index: 1000;
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        #notification.show { transform: translateX(-50%) translateY(0); }
        .notif-icon { width: 36px; height: 36px; background: #000000; color: #ffffff; border-radius: 8px; display: flex; align-items: center; justify-content: center; }

        /* Modals */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            z-index: 500;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal.active { display: flex; }

        .modal-content {
            background: #0d0d0d;
            border: 1px solid var(--border-light);
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            padding: 24px;
        }

        .modal-title { font-size: 1rem; font-weight: 700; margin-bottom: 16px; text-align: center; letter-spacing: 0.5px; }

        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 0.9rem;
            margin-bottom: 12px;
            outline: none;
        }

        .form-input:focus { border-color: var(--text-primary); }

        .form-select {
            width: 100%;
            background: #121212;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px;
            color: var(--text-primary);
            font-size: 0.9rem;
            margin-bottom: 12px;
            outline: none;
        }

        .modal-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            background: var(--text-primary);
            color: var(--bg-main);
            margin-top: 6px;
        }

        .photo-upload-zone {
            border: 1px dashed var(--border-light);
            border-radius: 10px;
            padding: 24px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.02);
        }

        .photo-preview { width: 100%; max-height: 200px; object-fit: cover; border-radius: 8px; display: none; margin-bottom: 16px; }
        .modal-buttons { display: flex; gap: 10px; margin-top: 10px; }
        .btn-cancel { background: transparent; border: 1px solid var(--border-color); color: var(--text-secondary); }
    </style>
</head>
<body>

    <!-- Auth Modal -->
    <div class="modal" id="auth-modal">
        <div class="modal-content">
            <div class="modal-title" id="auth-title">ログイン</div>
            <input type="email" id="auth-email" class="form-input" placeholder="メールアドレス">
            <input type="password" id="auth-password" class="form-input" placeholder="パスワード">
            <button class="modal-btn" id="auth-submit-btn" onclick="handleAuth()">ログイン</button>
            <div style="text-align:center; margin-top:14px; font-size:0.75rem; color:var(--text-secondary); cursor:pointer;" id="auth-switch-text" onclick="toggleAuthMode()">アカウントをお持ちでない方は新規登録</div>
        </div>
    </div>

    <!-- Initial Profile Setup Modal -->
    <div class="modal" id="username-modal">
        <div class="modal-content">
            <div class="modal-title">プロフィール設定</div>
            <input type="text" id="username-input" class="form-input" placeholder="ユーザー名 (例: shota_trophy)">
            <input type="text" id="bio-input" class="form-input" placeholder="ステータスメッセージ (例: 人生の実績解除中！)">
            <button class="modal-btn" onclick="saveInitialProfile()">決定する</button>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div class="modal" id="edit-profile-modal">
        <div class="modal-content">
            <div class="modal-title">プロフィールを編集</div>
            <div class="photo-upload-zone" onclick="document.getElementById('avatar-input').click()">
                <i class="fa-solid fa-camera" style="font-size: 1.5rem; color: var(--text-secondary); margin-bottom: 8px;"></i>
                <div style="font-size: 0.75rem; color: var(--text-secondary);">アイコン画像を変更</div>
            </div>
            <img id="avatar-preview" class="photo-preview" alt="Avatar Preview">
            <input type="file" id="avatar-input" accept="image/*" style="display: none;" onchange="previewAvatar(event)">
            
            <input type="text" id="edit-bio-input" class="form-input" placeholder="ステータスメッセージ">
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeModal('edit-profile-modal')">キャンセル</button>
                <button class="modal-btn" onclick="saveProfileChanges()">保存する</button>
            </div>
        </div>
    </div>

    <!-- Custom Trophy Modal -->
    <div class="modal" id="custom-trophy-modal">
        <div class="modal-content">
            <div class="modal-title">カスタム実績を作成</div>
            <input type="text" id="custom-title" class="form-input" placeholder="実績タイトル (例: 無限の彼方へ)">
            <input type="text" id="custom-condition" class="form-input" placeholder="達成条件 (例: 空を飛ぶ)">
            <select id="custom-rank" class="form-select">
                <option value="bronze">BRONZE</option>
                <option value="silver">SILVER</option>
                <option value="gold">GOLD</option>
                <option value="platinum">PLATINUM</option>
            </select>
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeModal('custom-trophy-modal')">キャンセル</button>
                <button class="modal-btn" onclick="addCustomTrophy()">作成する</button>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header>
        <div class="header-top">
            <div class="brand-logo" onclick="switchMainTab('trophies')">Life Trophies</div>
            <div class="header-right">
                <div class="progress-stat">PROGRESS <span id="progress-percent">0%</span></div>
                <button class="logout-btn" onclick="logout()">ログアウト</button>
            </div>
        </div>

        <div class="stats-grid" id="stats-grid-box">
            <div class="stat-badge"><span class="rank-label">PLATINUM</span><span class="rank-val" id="count-plat">0</span></div>
            <div class="stat-badge"><span class="rank-label">GOLD</span><span class="rank-val" id="count-gold">0</span></div>
            <div class="stat-badge"><span class="rank-label">SILVER</span><span class="rank-val" id="count-silver">0</span></div>
            <div class="stat-badge"><span class="rank-label">BRONZE</span><span class="rank-val" id="count-bronze">0</span></div>
        </div>
    </header>

    <div class="container" id="main-container"></div>

    <!-- Bottom Navigation Bar (合計4タブ) -->
    <nav class="bottom-nav">
        <button class="nav-item" id="nav-btn-feed" onclick="switchMainTab('feed')">
            <i class="fa-solid fa-house"></i>
            <span>ホーム</span>
        </button>
        <button class="nav-item active" id="nav-btn-trophies" onclick="switchMainTab('trophies')">
            <i class="fa-solid fa-trophy"></i>
            <span>実績</span>
        </button>
        <button class="nav-item" id="nav-btn-search" onclick="switchMainTab('search')">
            <i class="fa-solid fa-magnifying-glass"></i>
            <span>検索</span>
        </button>
        <button class="nav-item" id="nav-btn-profile" onclick="switchMainTab('profile')">
            <i class="fa-solid fa-user"></i>
            <span>マイページ</span>
        </button>
    </nav>

    <div id="notification">
        <div class="notif-icon"><i class="fa-solid fa-trophy"></i></div>
        <div class="notif-text">
            <div style="font-size: 0.6rem; font-weight: 900; color: #666;">Trophy Unlocked</div>
            <div class="title" id="notif-title" style="font-size: 0.85rem; font-weight: 700;">実績タイトル</div>
        </div>
    </div>

    <!-- Unlock Modal -->
    <div class="modal" id="unlock-modal">
        <div class="modal-content">
            <div class="modal-title" id="modal-trophy-title">実績を解除</div>
            <div class="photo-upload-zone" onclick="document.getElementById('photo-input').click()">
                <i class="fa-solid fa-camera" style="font-size: 1.5rem; color: var(--text-secondary); margin-bottom: 8px;"></i>
                <div style="font-size: 0.75rem; color: var(--text-secondary);">記録写真を添付 (任意)</div>
            </div>
            <img id="photo-preview" class="photo-preview" alt="Preview">
            <input type="file" id="photo-input" accept="image/*" capture="environment" style="display: none;" onchange="previewImage(event)">
            
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeModal('unlock-modal')">キャンセル</button>
                <button class="modal-btn" onclick="confirmUnlock()">解除する</button>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCYxWPvgUwPABCmvZyEZ_AXI-Q_yiDUlsg",
            authDomain: "dreamscometrue-45b45.firebaseapp.com",
            projectId: "dreamscometrue-45b45",
            storageBucket: "dreamscometrue-45b45.firebasestorage.app",
            messagingSenderId: "913187912196",
            appId: "1:913187912196:web:e2739facf7420836ee9351",
            measurementId: "G-YCH8JM2YCW"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let userState = {};
        let myProfile = { username: "", bio: "", avatar: "", following: [], followers: [] };
        let customTrophies = [];
        let isSignUpMode = false;
        let selectedTrophyId = null;
        let activeTab = 'trophies';
        let trophyFilter = 'all';
        let tempAvatarBase64 = "";

        const defaultTrophies = [
            { id: 1, name: '夢、叶えし者', condition: '夢を叶える', rank: 'platinum', isUltimate: true },
            { id: 2, name: 'バイリンガル', condition: 'TOEICで満点を取る', rank: 'gold' },
            { id: 3, name: '言語学者', condition: '漢検一級を取得', rank: 'gold' },
            { id: 4, name: 'Off the wall', condition: 'ベンチプレス100kgをクリア', rank: 'gold' },
            { id: 5, name: 'なにわの怪人', condition: '大阪環状線を徒歩で一周する', rank: 'gold' },
            { id: 6, name: '江戸の傾奇者', condition: '山手線を徒歩で一周する', rank: 'gold' },
            { id: 7, name: '孤独のファンタジー', condition: '1人で遊園地に行く', rank: 'gold' },

        auth.onAuthStateChanged(async user => {
            if (user) {
                currentUser = user;
                document.getElementById('auth-modal').classList.remove('active');
                await checkProfileAndLoad();
            } else {
                currentUser = null;
                userState = {};
                myProfile = { username: "", bio: "", avatar: "", following: [], followers: [] };
                document.getElementById('auth-modal').classList.add('active');
                switchMainTab('trophies');
            }
        });

        async function checkProfileAndLoad() {
            const userDoc = await db.collection('users').doc(currentUser.uid).get();
            if (userDoc.exists && userDoc.data().username) {
                const data = userDoc.data();
                myProfile = {
                    uid: currentUser.uid,
                    username: data.username || "",
                    bio: data.bio || "人生の実績解除中！",
                    avatar: data.avatar || "",
                    following: data.following || [],
                    followers: data.followers || []
                };
                loadUserData();
            } else {
                document.getElementById('username-modal').classList.add('active');
            }
        }

        async function saveInitialProfile() {
            const username = document.getElementById('username-input').value.trim();
            const bio = document.getElementById('bio-input').value.trim() || "人生の実績解除中！";
            if (!username) return alert('ユーザー名を入力してください');

            await db.collection('users').doc(currentUser.uid).set({
                username: username,
                bio: bio,
                avatar: "",
                following: [],
                followers: [],
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            myProfile.uid = currentUser.uid;
            myProfile.username = username;
            myProfile.bio = bio;
            document.getElementById('username-modal').classList.remove('active');
            loadUserData();
        }

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            document.getElementById('auth-title').innerText = isSignUpMode ? '新規アカウント登録' : 'ログイン';
            document.getElementById('auth-submit-btn').innerText = isSignUpMode ? '登録する' : 'ログイン';
            document.getElementById('auth-switch-text').innerText = isSignUpMode ? 'すでにアカウントをお持ちの方はログイン' : 'アカウントをお持ちでない方は新規登録';
        }

        async function handleAuth() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            if (!email || !password) return alert('メールアドレスとパスワードを入力してください');

            try {
                if (isSignUpMode) {
                    await auth.createUserWithEmailAndPassword(email, password);
                } else {
                    await auth.signInWithEmailAndPassword(email, password);
                }
            } catch (error) {
                alert('エラー: ' + error.message);
            }
        }

        async function logout() { await auth.signOut(); }

        async function loadUserData() {
            if (!currentUser) return;
            const docRef = db.collection('users').doc(currentUser.uid).collection('trophies').doc('status');
            const doc = await docRef.get();
            userState = doc.exists ? doc.data() || {} : {};

            const customDoc = await db.collection('users').doc(currentUser.uid).collection('trophies').doc('custom');
            const cDoc = await customDoc.get();
            customTrophies = cDoc.exists ? cDoc.data().items || [] : [];

            switchMainTab('trophies');
        }

        function switchMainTab(tab) {
            activeTab = tab;
            document.querySelectorAll('.nav-item').forEach(btn => btn.classList.remove('active'));
            if (document.getElementById(`nav-btn-${tab}`)) {
                document.getElementById(`nav-btn-${tab}`).classList.add('active');
            }

            const statsBox = document.getElementById('stats-grid-box');
            if (tab === 'trophies' || tab === 'other-profile') {
                statsBox.style.display = 'grid';
            } else {
                statsBox.style.display = 'none';
            }

            if (tab === 'trophies') renderTrophiesView();
            else if (tab === 'feed') renderFeedView();
            else if (tab === 'search') renderSearchView();
            else if (tab === 'profile') renderMyProfileView();
        }

        function getAllTrophies() {
            return [...defaultTrophies, ...customTrophies];
        }

        /* -------------------------------------------------------------
           実績一覧 View (真ん中のトロフィータブ)
        ------------------------------------------------------------- */
        function renderTrophiesView() {
            const container = document.getElementById('main-container');
            container.innerHTML = '';

            const actionRow = document.createElement('div');
            actionRow.style.cssText = 'display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;';
            actionRow.innerHTML = `
                <div style="font-size:0.85rem; font-weight:800; color:var(--text-primary);">🏆 トロフィーボード</div>
                <button class="btn-action-small" onclick="openModal('custom-trophy-modal')">+ カスタム実績</button>
            `;
            container.appendChild(actionRow);

            const filterRow = document.createElement('div');
            filterRow.style.cssText = 'display:flex; gap:6px; overflow-x:auto; margin-bottom:14px;';
            ['all', 'unlocked', 'platinum', 'gold', 'silver', 'bronze'].forEach(f => {
                const btn = document.createElement('button');
                btn.className = `btn-action-small ${trophyFilter === f ? 'following' : ''}`;
                btn.style.cssText += 'border-radius:20px; padding:6px 12px; font-size:0.7rem;';
                btn.innerText = f.toUpperCase();
                btn.onclick = () => { trophyFilter = f; renderTrophiesView(); };
                filterRow.appendChild(btn);
            });
            container.appendChild(filterRow);

            const trophyListEl = document.createElement('div');
            let count = { platinum: 0, gold: 0, silver: 0, bronze: 0 };
            let totalUnlocked = 0;
            const allTrophiesList = getAllTrophies();

            allTrophiesList.forEach(t => {
                const isUnlocked = !!userState[t.id];
                if (isUnlocked) {
                    count[t.rank]++;
                    totalUnlocked++;
                }

                if (trophyFilter !== 'all') {
                    if (trophyFilter === 'unlocked' && !isUnlocked) return;
                    if (trophyFilter !== 'unlocked' && t.rank !== trophyFilter) return;
                }

                const card = document.createElement('div');
                card.className = `trophy-card ${isUnlocked ? 'unlocked' : ''} ${t.isUltimate ? 'ultimate' : ''}`;
                
                card.innerHTML = `
                    <div class="icon-box"><i class="fa-solid fa-trophy"></i></div>
                    <div class="trophy-info">
                        <div class="trophy-name">${t.isUltimate ? '★ ' : ''}${t.name} ${t.isCustom ? '<span style="font-size:0.6rem; color:var(--text-secondary);">(カスタム)</span>' : ''}</div>
                        <div class="trophy-condition">${t.condition}</div>
                        <div class="trophy-meta">
                            <span class="rank-tag">${t.rank}</span>
                            ${isUnlocked ? `<span class="unlocked-tag"><i class="fa-solid fa-check"></i> ${userState[t.id].date}</span>` : ''}
                        </div>
                    </div>
                    ${!isUnlocked ? `<button class="unlock-btn" onclick="openUnlockModal('${t.id}')">解除</button>` : ''}
                `;
                trophyListEl.appendChild(card);
            });

            container.appendChild(trophyListEl);

            document.getElementById('count-plat').innerText = count.platinum;
            document.getElementById('count-gold').innerText = count.gold;
            document.getElementById('count-silver').innerText = count.silver;
            document.getElementById('count-bronze').innerText = count.bronze;

            const percent = Math.round((totalUnlocked / allTrophiesList.length) * 100);
            document.getElementById('progress-percent').innerText = `${percent}%`;
        }

            Object.keys(userState).forEach(id => {
                const item = userState[id];
                if (item && item.photo) {
                    count++;
                    const trophy = getAllTrophies().find(t => String(t.id) === String(id));
                    const el = document.createElement('div');
                    el.className = 'gallery-item';
                    el.innerHTML = `
                        <img src="${item.photo}">
                        <div class="gallery-item-title">${trophy ? trophy.name : '実績'}</div>
                    `;
                    grid.appendChild(el);
                }
            });

            if (count === 0) {
                container.innerHTML += '<div style="text-align:center; color:var(--text-secondary); font-size:0.8rem; padding:30px; background:var(--surface-card); border-radius:12px;">まだ写真付きで解除した実績がありません。<br>実績解除時に写真を撮影・添付するとここに並びます！</div>';
            } else {
                container.appendChild(grid);
            }
        }

        /* -------------------------------------------------------------
           タイムライン (Feed) View
        ------------------------------------------------------------- */
        async function renderFeedView() {
            const container = document.getElementById('main-container');
            container.innerHTML = '<div style="text-align:center; color:var(--text-secondary); font-size:0.8rem; padding:20px;">タイムライン読み込み中...</div>';

            try {
                const snapshot = await db.collection('posts').orderBy('createdAt', 'desc').limit(20).get();
                container.innerHTML = '<div style="font-size:0.9rem; font-weight:800; margin-bottom:14px; text-align:center;">📡 タイムライン</div>';

                if (snapshot.empty) {
                    container.innerHTML += '<div style="text-align:center; color:var(--text-secondary); font-size:0.8rem; padding:30px;">まだ投稿がありません。実績を解除してタイムラインに流そう！</div>';
                    return;
                }

                snapshot.forEach(doc => {
                    const post = doc.data();
                    const postId = doc.id;
                    const isLiked = (post.likes || []).includes(currentUser.uid);

                    const avatarHTML = post.userAvatar 
                        ? `<img src="${post.userAvatar}" class="feed-avatar">` 
                        : `<div class="feed-avatar"><i class="fa-solid fa-user"></i></div>`;

                    const card = document.createElement('div');
                    card.className = 'feed-card';
                    card.innerHTML = `
                        <div class="feed-header">
                            ${avatarHTML}
                            <div>
                                <div class="feed-user-name">@${post.username}</div>
                                <div class="feed-time">${post.date || ''}</div>
                            </div>
                        </div>

                        <div class="feed-trophy-banner">
                            <div style="font-size:0.65rem; color:var(--text-secondary); font-weight:800; letter-spacing:1px; margin-bottom:2px;">TROPHY UNLOCKED</div>
                            <div style="font-size:0.95rem; font-weight:800; color:var(--text-primary);">🏆 ${post.trophyName}</div>
                        </div>

                        ${post.photo ? `<img src="${post.photo}" class="feed-photo">` : ''}

                        <div class="feed-actions">
                            <div class="feed-action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${postId}', ${isLiked})">
                                <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                                <span>${(post.likes || []).length}</span>
                            </div>
                            <div class="feed-action-btn">
                                <i class="fa-regular fa-comment"></i>
                                <span>${(post.comments || []).length}</span>
                            </div>
                        </div>

                        <div class="feed-comments-section">
                            <div id="comments-list-${postId}">
                                ${(post.comments || []).map(c => `<div class="comment-item"><b>@${c.username}:</b> ${c.text}</div>`).join('')}
                            </div>
                            <div class="comment-input-box">
                                <input type="text" id="comment-input-${postId}" class="form-input" placeholder="お祝いコメントを入力..." style="margin-bottom:0; font-size:0.75rem; padding:8px 12px;">
                                <button class="btn-action-small" onclick="addComment('${postId}')">送信</button>
                            </div>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (e) {
                container.innerHTML = '<div style="text-align:center; color:var(--text-secondary); font-size:0.8rem;">フィードの読み込みに失敗しました</div>';
            }
        }

        async function toggleLike(postId, currentLiked) {
            const postRef = db.collection('posts').doc(postId);
            if (currentLiked) {
                await postRef.update({ likes: firebase.firestore.FieldValue.arrayRemove(currentUser.uid) });
            } else {
                await postRef.update({ likes: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
            }
            renderFeedView();
        }

        async function addComment(postId) {
            const input = document.getElementById(`comment-input-${postId}`);
            const text = input.value.trim();
            if (!text) return;

            const postRef = db.collection('posts').doc(postId);
            await postRef.update({
                comments: firebase.firestore.FieldValue.arrayUnion({
                    uid: currentUser.uid,
                    username: myProfile.username,
                    text: text,
                    createdAt: new Date().toISOString()
                })
            });

            input.value = '';
            renderFeedView();
        }

                <div style="display:flex; gap:10px; margin-bottom:20px;">
                    <input type="text" id="search-query" class="form-input" placeholder="ユーザー名で検索..." style="margin-bottom:0;">
                    <button class="modal-btn" style="width: 100px; margin-top:0;" onclick="searchUsers()">検索</button>
                </div>
                <div id="search-results"></div>
            `;
        }

        async function searchUsers() {
            const q = document.getElementById('search-query').value.trim();
            const resultsEl = document.getElementById('search-results');
            resultsEl.innerHTML = '<div style="text-align:center; color:var(--text-secondary); font-size:0.8rem;">検索中...</div>';

            try {
                const snapshot = await db.collection('users').get();
                resultsEl.innerHTML = '';
                let found = false;

                snapshot.forEach(doc => {
                    const data = doc.data();
                    if (data.username && data.username.includes(q) && doc.id !== currentUser.uid) {
                        found = true;
                        const avatarHTML = data.avatar 
                            ? `<img src="${data.avatar}" class="feed-avatar">` 
                            : `<div class="feed-avatar"><i class="fa-solid fa-user"></i></div>`;

                        const card = document.createElement('div');
                        card.className = 'feed-card';
                        card.style.cssText = 'display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; padding:12px 16px; cursor:pointer;';
                        card.innerHTML = `
                            <div style="display:flex; align-items:center; gap:12px;">
                                ${avatarHTML}
                                <div>
                                    <div style="font-size:0.9rem; font-weight:700;">@${data.username}</div>
                                    <div style="font-size:0.7rem; color:var(--text-secondary);">${data.bio || 'ステータスなし'}</div>
                                </div>
                            </div>
                            <i class="fa-solid fa-chevron-right" style="color:var(--text-secondary);"></i>
                        `;
                        card.onclick = () => viewUserProfile(doc.id, data);
                        resultsEl.appendChild(card);
                    }
                });

                if (!found) {
                    resultsEl.innerHTML = '<div style="text-align:center; color:var(--text-secondary); font-size:0.8rem;">ユーザーが見つかりませんでした</div>';
                }
            } catch (e) {
                resultsEl.innerHTML = '<div style="text-align:center; color:var(--text-secondary); font-size:0.8rem;">検索エラーが発生しました</div>';
            }
        }

        async function viewUserProfile(uid, profileData) {
            const doc = await db.collection('users').doc(uid).collection('trophies').doc('status').get();
            const targetState = doc.exists ? doc.data() || {} : {};
            profileData.uid = uid;
            
            const statsBox = document.getElementById('stats-grid-box');
            statsBox.style.display = 'grid';
            
            // 他人のプロフィールを表示
            const container = document.getElementById('main-container');
            container.innerHTML = '';

            const headerBox = document.createElement('div');
            headerBox.className = 'profile-card-header';
            
            const avatarHTML = profileData.avatar 
                ? `<img src="${profileData.avatar}" class="profile-avatar-large">` 
                : `<div class="profile-avatar-large"><i class="fa-solid fa-user"></i></div>`;

            const isFollowing = myProfile.following.includes(uid);

            headerBox.innerHTML = `
                ${avatarHTML}
                <div class="profile-info">
                    <div class="profile-username">@${profileData.username}</div>
                    <div class="profile-bio">${profileData.bio || 'ステータス未設定'}</div>
                    <div class="follow-stats-row">
                        <div>フォロー <span>${(profileData.following || []).length}</span></div>
                        <div>フォロワー <span>${(profileData.followers || []).length}</span></div>
                    </div>
                    <button class="btn-action-small ${isFollowing ? 'following' : ''}" onclick="toggleFollow('${uid}')">${isFollowing ? 'フォロー中' : 'フォローする'}</button>
                </div>
            `;
            container.appendChild(headerBox);

            // 他人の実績一覧
            const trophyListEl = document.createElement('div');
            let count = { platinum: 0, gold: 0, silver: 0, bronze: 0 };
            let totalUnlocked = 0;

            defaultTrophies.forEach(t => {
                const isUnlocked = !!targetState[t.id];
                if (isUnlocked) {
                    count[t.rank]++;
                    totalUnlocked++;
                }

                const card = document.createElement('div');
                card.className = `trophy-card ${isUnlocked ? 'unlocked' : ''} ${t.isUltimate ? 'ultimate' : ''}`;
                card.innerHTML = `
                    <div class="icon-box"><i class="fa-solid fa-trophy"></i></div>
                    <div class="trophy-info">
                        <div class="trophy-name">${t.isUltimate ? '★ ' : ''}${t.name}</div>
                        <div class="trophy-condition">${t.condition}</div>
                        <div class="trophy-meta">
                            <span class="rank-tag">${t.rank}</span>
                            ${isUnlocked ? `<span class="unlocked-tag"><i class="fa-solid fa-check"></i> ${targetState[t.id].date}</span>` : ''}
                        </div>
                    </div>
                `;
                trophyListEl.appendChild(card);
            });

            container.appendChild(trophyListEl);

            document.getElementById('count-plat').innerText = count.platinum;
            document.getElementById('count-gold').innerText = count.gold;
            document.getElementById('count-silver').innerText = count.silver;
            document.getElementById('count-bronze').innerText = count.bronze;

            const percent = Math.round((totalUnlocked / defaultTrophies.length) * 100);
            document.getElementById('progress-percent').innerText = `${percent}%`;
        }

        async function toggleFollow(targetUid) {
            const isFollowing = myProfile.following.includes(targetUid);
            const myRef = db.collection('users').doc(currentUser.uid);
            const targetRef = db.collection('users').doc(targetUid);

            if (isFollowing) {
                await myRef.update({ following: firebase.firestore.FieldValue.arrayRemove(targetUid) });
                await targetRef.update({ followers: firebase.firestore.FieldValue.arrayRemove(currentUser.uid) });
                myProfile.following = myProfile.following.filter(id => id !== targetUid);
            } else {
                await myRef.update({ following: firebase.firestore.FieldValue.arrayUnion(targetUid) });
                await targetRef.update({ followers: firebase.firestore.FieldValue.arrayUnion(currentUser.uid) });
                myProfile.following.push(targetUid);
            }

            showNotification(isFollowing ? 'フォロー解除しました' : 'フォローしました');
            renderSearchView();
        }

        async function addCustomTrophy() {
            const title = document.getElementById('custom-title').value.trim();
            const condition = document.getElementById('custom-condition').value.trim();
            const rank = document.getElementById('custom-rank').value;
            if (!title || !condition) return alert('タイトルと条件を入力してください');

            const newTrophy = {
                id: 'custom_' + Date.now(),
                name: title,
                condition: condition,
                rank: rank,
                isCustom: true
            };

            customTrophies.push(newTrophy);
            await db.collection('users').doc(currentUser.uid).collection('trophies').doc('custom').set({ items: customTrophies });

            closeModal('custom-trophy-modal');
            document.getElementById('custom-title').value = '';
            document.getElementById('custom-condition').value = '';
            switchMainTab('trophies');
            showNotification('カスタム実績を追加しました');
        }

        function openEditProfileModal() {
            document.getElementById('edit-bio-input').value = myProfile.bio;
            const img = document.getElementById('avatar-preview');
            if (myProfile.avatar) {
                img.src = myProfile.avatar;
                img.style.display = 'block';
            } else {
                img.style.display = 'none';
            }
            tempAvatarBase64 = myProfile.avatar;
            openModal('edit-profile-modal');
        }

        function previewAvatar(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    tempAvatarBase64 = evt.target.result;
                    const img = document.getElementById('avatar-preview');
                    img.src = tempAvatarBase64;
                    img.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        async function saveProfileChanges() {
            const newBio = document.getElementById('edit-bio-input').value.trim() || "人生の実績解除中！";
            myProfile.bio = newBio;
            myProfile.avatar = tempAvatarBase64;

            await db.collection('users').doc(currentUser.uid).set({
                bio: newBio,
                avatar: tempAvatarBase64,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }, { merge: true });

            closeModal('edit-profile-modal');
            switchMainTab('profile');
            showNotification('プロフィールを更新しました');
        }

        function openUnlockModal(id) {
            selectedTrophyId = id;
            const trophy = getAllTrophies().find(t => String(t.id) === String(id));
            document.getElementById('modal-trophy-title').innerText = `「${trophy.name}」`;
            document.getElementById('photo-preview').style.display = 'none';
            document.getElementById('photo-input').value = '';
            openModal('unlock-modal');
        }

        function previewImage(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const img = document.getElementById('photo-preview');
                    img.src = evt.target.result;
                    img.style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        async function confirmUnlock() {
            if (!selectedTrophyId) return;

            const trophy = getAllTrophies().find(t => String(t.id) === String(selectedTrophyId));
            const dateStr = new Date().toLocaleDateString('ja-JP', { year: 'numeric', month: '2-digit', day: '2-digit' });
            const photoData = document.getElementById('photo-preview').src || null;

            userState[selectedTrophyId] = {
                date: dateStr,
                photo: photoData
            };

            await db.collection('users').doc(currentUser.uid).collection('trophies').doc('status').set(userState);

            await db.collection('posts').add({
                uid: currentUser.uid,
                username: myProfile.username,
                userAvatar: myProfile.avatar,
                trophyId: selectedTrophyId,
                trophyName: trophy.name,
                photo: photoData,
                date: dateStr,
                likes: [],
                comments: [],
                createdAt: firebase.firestore.FieldValue.serverTimestamp()
            });

            closeModal('unlock-modal');
            switchMainTab('trophies');
            showNotification(trophy.name);
        }

        function openModal(id) { document.getElementById(id).classList.add('active'); }
        function closeModal(id) { document.getElementById(id).classList.remove('active'); }

        function showNotification(title) {
            const notif = document.getElementById('notification');
            document.getElementById('notif-title').innerText = title;
            notif.classList.add('show');
            setTimeout(() => notif.classList.remove('show'), 3500);
        }
    </script>
</body>
</html>
